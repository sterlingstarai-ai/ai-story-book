name: ai_story_book
description: AI로 맞춤형 동화책을 생성하는 모바일 앱
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Networking
  dio: ^5.9.1

  # Local Storage
  shared_preferences: ^2.2.2

  # UI
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Utils
  uuid: ^4.2.2
  # flutter_localizations가 SDK 버전별로 intl을 고정함(3.27.x→0.19.0, 3.38.x→0.20.x).
  # CI(3.27.1)·로컬(3.38.7) 양쪽에서 해석되도록 범위로 둔다(직접 사용은 l10n 생성코드뿐).
  intl: ">=0.19.0 <0.21.0"

  # File System & Sharing
  path_provider: ^2.1.2
  share_plus: ^7.2.2
  printing: ^5.13.4
  confetti: ^0.8.0

  # Local Notifications (잠자리 알림)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Audio Player
  just_audio: ^0.9.36
  in_app_review: ^2.0.10
  in_app_purchase: ^3.2.0

  # Image Picker
  image_picker: ^1.0.7
  file_picker: ^8.0.6

  # Icons
  cupertino_icons: ^1.0.6
  kakao_flutter_sdk_share: ^1.10.0
  kakao_flutter_sdk_common: ^1.10.0
  kakao_flutter_sdk_template: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/branding/
    - assets/icons/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#F8F9FC"
  adaptive_icon_foreground: assets/icons/app_icon.png

flutter_native_splash:
  color: "#F8F9FC"
  image: assets/branding/splash.png
  android: true
  ios: true
  web: false
  fullscreen: true
