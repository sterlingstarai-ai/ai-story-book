version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # celery[redis]==5.4.0 currently conflicts with redis>=7
      - dependency-name: "redis"
        versions: [">=7.0.0"]
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "pub"
    directory: "/apps/mobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # build_runner>=2.10.0 requires Dart >=3.7, but CI/runtime is on Dart 3.6
      - dependency-name: "build_runner"
        versions: [">=2.10.0"]
      # major lint-rule jump needs a dedicated lint-fix rollout
      - dependency-name: "flutter_lints"
        versions: [">=6.0.0"]
    labels:
      - "dependencies"
      - "flutter"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
