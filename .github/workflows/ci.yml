name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  # 프로젝트는 Flutter 3.38.x를 타깃(initialValue·intl 0.20.x 등 3.38 API 사용).
  # CI를 개발/검증 환경과 동일하게 맞춘다(3.27.1은 analyze에서 initialValue 미정의로 실패).
  FLUTTER_VERSION: '3.38.7'

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  api-test:
    name: API Tests + Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff safety coverage

      - name: Run linting
        working-directory: apps/api
        run: ruff check src/ tests/

      - name: Check for security vulnerabilities
        working-directory: apps/api
        run: safety check -r requirements.txt --output text || echo "Security check completed with warnings"

      - name: Check environment contracts
        run: |
          chmod +x scripts/check-env.sh
          ./scripts/check-env.sh --mode ci

      - name: Run database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        run: alembic upgrade head

      - name: Run tests with coverage
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          TESTING: true
          LLM_PROVIDER: mock
          IMAGE_PROVIDER: mock
          TTS_PROVIDER: mock
        run: |
          pytest tests/ -v --cov=src --cov-report=xml 2>&1 | tee test-output.log
          coverage report --fail-under=40

      - name: Live E2E journey (full generation pipeline)
        # TESTING=false 실서버로 전체 생성 파이프라인(create→done)+성장·또래·오디오게이트·
        # IDOR·동의철회를 검증. SQLite+mock providers라 키·Postgres·Redis·S3 불필요.
        env:
          APP_VERSION: "0.3.2"
        run: bash scripts/run_live_e2e.sh

      - name: Golden prompts structural harness
        # docs/qa/golden-prompts.json 을 실제 생성 파이프라인으로 통과시켜 출시 품질의
        # 구조 계약(파이프라인 완주·페이지 정합·placeholder 없음·학습자산·퀴즈·warnings/
        # asset_status)을 결정적으로 검증. mock·in-process·전용 sqlite라 키 불필요.
        # (내용/의미 품질 실측은 실키 --live 모드 — 창업자 결정 단계.)
        working-directory: apps/api
        run: python scripts/golden_prompts_harness.py

      - name: Upload API logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: api-test-logs
          path: apps/api/test-output.log
          retention-days: 7

      - name: Upload API coverage
        if: success()
        uses: codecov/codecov-action@v5
        with:
          files: apps/api/coverage.xml
          flags: api

  flutter-test:
    name: Flutter Analyze + Tests + Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Run analyzer
        working-directory: apps/mobile
        run: flutter analyze 2>&1 | tee analyze-output.log

      - name: Run tests with coverage
        working-directory: apps/mobile
        run: flutter test --coverage 2>&1 | tee test-output.log

      - name: Run integration tests (headless flutter_tester)
        # 멀티화면 라우팅 여정(StartupGate→동의→온보딩→홈, 홈→읽기성장)을 디바이스 없이
        # flutter_tester로 구동. 연결된 디바이스가 없으면 헤드리스로 실행된다.
        working-directory: apps/mobile
        run: flutter test integration_test/ 2>&1 | tee integration-output.log

      - name: Check Flutter coverage threshold
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lcov = Path('apps/mobile/coverage/lcov.info')
          if not lcov.exists():
              raise SystemExit('coverage/lcov.info not found')
          total = 0
          covered = 0
          for line in lcov.read_text().splitlines():
              if line.startswith('LF:'):
                  total += int(line[3:])
              elif line.startswith('LH:'):
                  covered += int(line[3:])
          coverage = (covered / total * 100) if total else 0.0
          print(f'Flutter line coverage: {coverage:.2f}% ({covered}/{total})')
          if coverage < 25:
              raise SystemExit('Flutter coverage below 25% threshold')
          PY

      - name: Upload Flutter logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: flutter-test-logs
          path: |
            apps/mobile/analyze-output.log
            apps/mobile/test-output.log
          retention-days: 7

      - name: Upload Flutter coverage
        if: success()
        uses: codecov/codecov-action@v5
        with:
          files: apps/mobile/coverage/lcov.info
          flags: flutter

  phase-gate:
    name: Phase Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: apps/api/requirements.txt

      - name: Install API dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Check environment contracts
        run: |
          chmod +x scripts/check-env.sh scripts/phase-gate.sh scripts/smoke.sh
          ./scripts/check-env.sh --mode ci

      - name: Run database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        run: alembic upgrade head

      - name: Start API server for smoke gate
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          TESTING: true
          USE_CELERY: false
          LLM_PROVIDER: mock
          IMAGE_PROVIDER: mock
          TTS_PROVIDER: mock
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: test-access-key
          S3_SECRET_KEY: test-secret-key
          S3_BUCKET: storybook
        run: |
          nohup python -m uvicorn src.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api-smoke.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api-smoke.pid"
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API server failed to become healthy"
          cat "$RUNNER_TEMP/api-smoke.log"
          exit 1

      - name: Run phase gate
        env:
          API_SMOKE_BASE_URL: http://127.0.0.1:8000
          # phase-gate.sh가 in-process로 `pytest tests`를 돌리므로 API Tests 잡과 동일한
          # 테스트 env가 필요(특히 TESTING=true — 미설정 시 레이트리미터가 켜져 429 대량 발생).
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          TESTING: true
          LLM_PROVIDER: mock
          IMAGE_PROVIDER: mock
          TTS_PROVIDER: mock
        run: ./scripts/phase-gate.sh --with-mobile-build --with-api-smoke

      - name: Upload phase gate logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: phase-gate-logs
          path: |
            ${{ runner.temp }}/api-smoke.log
            apps/api/test-output.log
            apps/mobile/test-output.log
          retention-days: 7

      - name: Stop API server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/api-smoke.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/api-smoke.pid")" || true
          fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner (repo)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '0'

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [api-test, flutter-test, phase-gate, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:latest
            ghcr.io/${{ github.repository }}/worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/api:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-api-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-api-results.sarif'

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: GITHUB_SHA,GITHUB_REPOSITORY
          script: |
            set -euo pipefail
            cd /opt/ai-story-book
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            ./scripts/deploy.sh --env-file infra/.env --image-tag "$GITHUB_SHA" deploy
            ./scripts/smoke.sh http://localhost

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed! Commit: ${{ github.sha }}"
          echo "Please check the logs and consider rolling back."
