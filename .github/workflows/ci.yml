name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.11'
  # 프로젝트는 Flutter 3.38.x를 타깃(initialValue·intl 0.20.x 등 3.38 API 사용).
  # CI를 개발/검증 환경과 동일하게 맞춘다(3.27.1은 analyze에서 initialValue 미정의로 실패).
  FLUTTER_VERSION: '3.38.7'

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  api-test:
    name: API Tests + Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # CI-2: 미핀 설치는 로컬(0.14.14)보다 최신 ruff를 끌어와 기본 rule set이
          # 달라진다(0.16은 기본 접두가 2→36개 → 같은 코드가 726 errors). 도구 버전을
          # 로컬과 일치시키고, 규칙 자체는 apps/api/pyproject.toml [tool.ruff]가 고정한다.
          pip install ruff==0.14.14 safety coverage

      - name: Run linting
        working-directory: apps/api
        run: ruff check src/ tests/

      - name: Check for security vulnerabilities (advisory)
        working-directory: apps/api
        # CI-1 후속: safety 무료 DB가 **존재하지 않는 수정 버전**을 요구해 게이트가 원리적으로
        # 충족 불가하다(실측: python-multipart→0.0.31, pytest→9.0.3, python-dotenv→1.2.2 모두
        # PyPI 미존재. dotenv는 이미 최신 1.2.1인데도 상향을 요구). 실제 취약점이 아니라 DB 품질
        # 문제이므로 advisory로 낮춘다.
        #
        # 중요(감사 M2 'silent safety' 재발 방지): `|| echo`로 종료코드를 삼키지 않는다 —
        # continue-on-error로 **실패가 노란색으로 보이게** 두고, 차단 정본은 Trivy fs
        # (CRITICAL+HIGH 하드 블로킹)가 담당한다. 출시 후 safety DB 품질을 재평가한다.
        continue-on-error: true
        run: safety check -r requirements.txt --output text

      - name: Check env example files exist
        run: |
          chmod +x scripts/check-env.sh
          ./scripts/check-env.sh --mode ci

      - name: Run database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        run: alembic upgrade head

      - name: Run tests with coverage
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          TESTING: true
          LLM_PROVIDER: mock
          IMAGE_PROVIDER: mock
          TTS_PROVIDER: mock
        run: |
          set -o pipefail
          pytest tests/ -v --cov=src --cov-report=xml 2>&1 | tee test-output.log
          coverage report --fail-under=40

      - name: Money-path coverage gate
        working-directory: apps/api
        # L2: 전역 40% 임계는 결제·크레딧 파일이 0%로 떨어져도 통과시킨다. money 경로별
        # per-file 임계(회귀 방지 기준선)를 별도 게이트해 결제 코드 테스트 소실을 감지.
        run: python scripts/coverage_gate.py coverage.xml

      - name: Live E2E journey (full generation pipeline)
        # TESTING=false 실서버로 전체 생성 파이프라인(create→done)+성장·또래·오디오게이트·
        # IDOR·동의철회를 검증. SQLite+mock providers라 키·Postgres·Redis·S3 불필요.
        run: bash scripts/run_live_e2e.sh

      - name: Golden prompts structural harness
        # docs/qa/golden-prompts.json 을 실제 생성 파이프라인으로 통과시켜 출시 품질의
        # 구조 계약(파이프라인 완주·페이지 정합·placeholder 없음·학습자산·퀴즈·warnings/
        # asset_status)을 결정적으로 검증. mock·in-process·전용 sqlite라 키 불필요.
        # (내용/의미 품질 실측은 실키 --live 모드 — 창업자 결정 단계.)
        working-directory: apps/api
        run: python scripts/golden_prompts_harness.py

      - name: Upload API logs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: api-test-logs
          path: apps/api/test-output.log
          retention-days: 7

      - name: Upload API coverage
        if: success()
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: apps/api/coverage.xml
          flags: api

  flutter-test:
    name: Flutter Analyze + Tests + Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Run analyzer
        working-directory: apps/mobile
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze-output.log

      - name: Run tests with coverage
        working-directory: apps/mobile
        run: |
          set -o pipefail
          flutter test --coverage 2>&1 | tee test-output.log

      - name: Run integration tests (headless flutter_tester)
        # 멀티화면 라우팅 여정(StartupGate→동의→온보딩→홈, 홈→읽기성장)을 디바이스 없이 구동.
        # CI-3: `flutter test integration_test/`는 디바이스를 자동 선택하지 않아 러너에서
        # "No devices are connected"로 실패한다(로컬에서도 동일 재현). 헤드리스 디바이스를
        # 명시해야 한다 — 조용한 스킵 대신 실제로 실행되는 게이트로 유지.
        working-directory: apps/mobile
        run: |
          set -o pipefail
          flutter test integration_test/ -d flutter-tester 2>&1 | tee integration-output.log

      - name: Check Flutter coverage threshold
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lcov = Path('apps/mobile/coverage/lcov.info')
          if not lcov.exists():
              raise SystemExit('coverage/lcov.info not found')
          total = 0
          covered = 0
          for line in lcov.read_text().splitlines():
              if line.startswith('LF:'):
                  total += int(line[3:])
              elif line.startswith('LH:'):
                  covered += int(line[3:])
          coverage = (covered / total * 100) if total else 0.0
          print(f'Flutter line coverage: {coverage:.2f}% ({covered}/{total})')
          if coverage < 25:
              raise SystemExit('Flutter coverage below 25% threshold')
          PY

      - name: Upload Flutter logs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: flutter-test-logs
          path: |
            apps/mobile/analyze-output.log
            apps/mobile/test-output.log
          retention-days: 7

      - name: Upload Flutter coverage
        if: success()
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: apps/mobile/coverage/lcov.info
          flags: flutter

  phase-gate:
    name: Phase Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: apps/api/requirements.txt

      - name: Install API dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Check env example files exist
        run: |
          chmod +x scripts/check-env.sh scripts/phase-gate.sh scripts/smoke.sh
          ./scripts/check-env.sh --mode ci

      - name: Run database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        run: alembic upgrade head

      - name: Start API server for smoke gate
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          TESTING: true
          USE_CELERY: false
          LLM_PROVIDER: mock
          IMAGE_PROVIDER: mock
          TTS_PROVIDER: mock
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: test-access-key
          S3_SECRET_KEY: test-secret-key
          S3_BUCKET: storybook
        run: |
          nohup python -m uvicorn src.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api-smoke.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api-smoke.pid"
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API server failed to become healthy"
          cat "$RUNNER_TEMP/api-smoke.log"
          exit 1

      - name: Run phase gate
        env:
          API_SMOKE_BASE_URL: http://127.0.0.1:8000
          # phase-gate.sh가 in-process로 `pytest tests`를 돌리므로 API Tests 잡과 동일한
          # 테스트 env가 필요(특히 TESTING=true — 미설정 시 레이트리미터가 켜져 429 대량 발생).
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          TESTING: true
          LLM_PROVIDER: mock
          IMAGE_PROVIDER: mock
          TTS_PROVIDER: mock
        run: ./scripts/phase-gate.sh --with-mobile-build --with-api-smoke

      - name: Upload phase gate logs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: phase-gate-logs
          path: |
            ${{ runner.temp }}/api-smoke.log
            apps/api/test-output.log
            apps/mobile/test-output.log
          retention-days: 7

      - name: Stop API server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/api-smoke.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/api-smoke.pid")" || true
          fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner (repo)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          # S2: CRITICAL만 차단하던 정책이 CVE-2024-53981(python-multipart, HIGH 7.5 —
          # near-unauth 업로드 DoS)을 통과시켰다. 의존성(fs) 스캔은 HIGH도 blocking으로
          # 올린다. 이미지 스캔은 베이스 이미지 전이 HIGH 소음이 커 CRITICAL 유지.
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '1'

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [api-test, flutter-test, phase-gate, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # M1: 이미지 빌드/푸시는 취소되어 반쪽 태그를 남기면 안 됨 — 직렬화, 취소 금지.
    concurrency:
      group: build-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # M7: 이미지를 먼저 로컬로 빌드(push:false·load:true)해 스캔 통과 후에만 게시한다.
      # '외부 부작용 먼저 → 검증 나중' 방지 — 취약 이미지가 :latest로 공개되는 창 제거.
      - name: Build API image (local, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          # 베이스 이미지를 항상 최신으로 pull — 업스트림(Debian)이 OS CVE 수정을 내면
          # 다음 빌드가 자동 수용한다(ignore-unfixed와 한 쌍).
          pull: true
          push: false
          load: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker image (local, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/api
          file: apps/api/Dockerfile.worker
          pull: true
          push: false
          load: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:latest
            ghcr.io/${{ github.repository }}/worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # M2·M7: CRITICAL은 blocking(exit-code 1). severity는 G30(CRITICAL 차단)과 통일.
      # ignore-unfixed: 수정본이 존재하는 취약점만 차단한다. 근거(2026-08-01): main 첫 빌드가
      # 베이스(python:3.11-slim=Debian) 필수 패키지 perl-base의 CRITICAL 2건
      # (CVE-2026-57433·CVE-2026-13221, Fixed Version 없음)으로 영구 red — 행동 불가능한
      # CVE는 게이트가 아니라 노이즈다. 가시성은 SARIF 업로드(code scanning)로 유지되고,
      # 수정본이 나오면 pull:true가 다음 빌드에서 자동 수용 + 그때부터는 미적용 시 차단된다.
      # limit-severities-for-sarif: trivy-action은 format=sarif일 때 이 플래그 없이는
      # severity 입력을 **무시하고 전 심각도를 스캔**해, exit-code 1이 CRITICAL이 아니라
      # 아무 취약점(수정본 있는 HIGH/MEDIUM 포함)에 발동한다(2026-08-01 main 2차 red의 실원인 —
      # 실행 로그의 trivy 옵션에 --severity가 빠져 있음). 이 플래그가 있어야 G30(CRITICAL 차단)
      # 의미론이 실제로 적용된다. 이미지의 HIGH 이하 가시성은 fs 스캔(Security Scan 잡,
      # CRITICAL+HIGH 블로킹)과 출시 후 이미지 리포트 태스크가 담당.
      - name: Scan API image (blocking, pre-push)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/api:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-api-results.sarif'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          limit-severities-for-sarif: true

      - name: Scan Worker image (blocking, pre-push)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/worker:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-worker-results.sarif'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          limit-severities-for-sarif: true

      # hashFiles 가드: 선행 스캔이 red면 해당 SARIF가 없어 업로드가 'Path does not exist'로
      # 이중 실패를 만든다(진짜 원인을 가리는 red-herring — 두 라운드 연속 진단을 방해).
      - name: Upload Trivy API scan results
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        if: always() && hashFiles('trivy-api-results.sarif') != ''
        with:
          sarif_file: 'trivy-api-results.sarif'

      - name: Upload Trivy Worker scan results
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        if: always() && hashFiles('trivy-worker-results.sarif') != ''
        with:
          sarif_file: 'trivy-worker-results.sarif'

      # 스캔을 통과한 경우에만 도달 — 스캔이 exit-code 1로 red면 이 스텝은 건너뛴다.
      - name: Push images to registry
        run: |
          docker push ghcr.io/${{ github.repository }}/api:latest
          docker push ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/worker:latest
          docker push ghcr.io/${{ github.repository }}/worker:${{ github.sha }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    # M1: 진행 중 배포는 절대 취소되지 않고 직렬화(다음 배포는 큐잉) — 부분배포 방치 방지.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: GITHUB_SHA,GITHUB_REPOSITORY
          script: |
            set -euo pipefail
            cd /opt/ai-story-book
            git fetch origin
            git checkout --detach "$GITHUB_SHA"
            ./scripts/deploy.sh --env-file infra/.env --image-tag "$GITHUB_SHA" deploy
            ./scripts/smoke.sh http://localhost

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed! Commit: ${{ github.sha }}"
          echo "Please check the logs and consider rolling back."
