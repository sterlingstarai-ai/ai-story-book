services:
  postgres:
    image: postgres:15-alpine
    container_name: storybook-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-storybook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storybook123}
      POSTGRES_DB: ${POSTGRES_DB:-storybook}
    ports:
      # L1: 호스트 포트를 파라미터화 — 로컬에 네이티브 postgres 가 떠 있으면 5432 가
      # 점유돼 `docker compose up` 이 bind 실패로 죽는다. POSTGRES_HOST_PORT 로 회피.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-storybook}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - storybook-net

  redis:
    image: redis:7-alpine
    container_name: storybook-redis
    # M1: `--requirepass ${REDIS_PASSWORD:-}` 는 값이 없으면 인자 없는 `--requirepass` 가
    # 되어 redis 가 FATAL 로 즉사한다("wrong number of arguments"). 그런데 REDIS_PASSWORD
    # 는 리포 어느 .env.example·env.schema 에도 없어서, 문서대로 따라한 신규 개발자는
    # 반드시 막혔다. 개발 스택은 로컬 전용(127.0.0.1 바인딩)이므로 인증 없이 기동하고,
    # 비밀번호가 필요하면 REDIS_PASSWORD 를 주면 그때만 켜진다.
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ];
             then exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
             else exec redis-server --appendonly yes; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # 비밀번호를 켠 구성에서도 healthcheck 가 통과해야 한다(AUTH 필요).
      test: ["CMD-SHELL", 'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - storybook-net

  minio:
    image: minio/minio:latest
    container_name: storybook-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - storybook-net

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: storybook-api
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-storybook}:${POSTGRES_PASSWORD:-storybook123}@postgres:5432/${POSTGRES_DB:-storybook}
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # Celery
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - USE_CELERY=${USE_CELERY:-false}
      # Storage
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - S3_BUCKET=storybook
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://localhost:9000/storybook}
      # LLM - defaults to mock, set LLM_API_KEY to use real provider
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-30}
      # Image - defaults to mock, set IMAGE_API_KEY to use real provider
      - IMAGE_PROVIDER=${IMAGE_PROVIDER:-mock}
      - IMAGE_API_KEY=${IMAGE_API_KEY:-}
      - IMAGE_TIMEOUT=${IMAGE_TIMEOUT:-90}
      - IMAGE_MAX_CONCURRENT=${IMAGE_MAX_CONCURRENT:-3}
      - IMAGE_MAX_RETRIES=${IMAGE_MAX_RETRIES:-3}
      # TTS - defaults to mock, set TTS API keys to use real provider
      - TTS_PROVIDER=${TTS_PROVIDER:-mock}
      - GOOGLE_TTS_API_KEY=${GOOGLE_TTS_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Rate Limiting
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-10}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
      # Admin
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../apps/api:/app
    networks:
      - storybook-net

  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: storybook-worker
    command: celery -A src.worker worker --loglevel=info
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-storybook}:${POSTGRES_PASSWORD:-storybook123}@postgres:5432/${POSTGRES_DB:-storybook}
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # Celery
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # Storage
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - S3_BUCKET=storybook
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://localhost:9000/storybook}
      # LLM
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-30}
      # Image
      - IMAGE_PROVIDER=${IMAGE_PROVIDER:-mock}
      - IMAGE_API_KEY=${IMAGE_API_KEY:-}
      - IMAGE_TIMEOUT=${IMAGE_TIMEOUT:-90}
      - IMAGE_MAX_CONCURRENT=${IMAGE_MAX_CONCURRENT:-3}
      - IMAGE_MAX_RETRIES=${IMAGE_MAX_RETRIES:-3}
      # TTS
      - TTS_PROVIDER=${TTS_PROVIDER:-mock}
      - GOOGLE_TTS_API_KEY=${GOOGLE_TTS_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
    depends_on:
      - api
    volumes:
      - ../apps/api:/app
    networks:
      - storybook-net

networks:
  storybook-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
