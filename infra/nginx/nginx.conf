worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream API servers
    upstream api_servers {
        least_conn;
        server api:8000 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ══════════════════════════════════════════════════════════════════════════
    # H9(2026-08-17 감사): 프로덕션 엣지 TLS.
    #
    # 이전에는 443 리스너·리다이렉트·HSTS가 전부 주석이었고 DEPLOYMENT.md에도 절차가
    # 없었다 → **X-User-Key(유일 자격증명)와 아동 콘텐츠가 평문으로 전송**됐다.
    # 자격증명이 헤더 하나뿐이라 중간자 1회 노출이 곧 계정 탈취다.
    #
    # 인증서 발급/갱신은 오너 실환경 작업이다(DEPLOYMENT.md "TLS 종단" 절 참조).
    # 인증서를 넣기 전에는 `docker compose -f docker-compose.prod.yml` 의 nginx 가
    # 이 설정으로 기동하지 않는다 — 그게 의도된 fail-closed 다(평문 배포 금지).
    # ══════════════════════════════════════════════════════════════════════════

    # 80: ACME 챌린지만 허용하고 나머지는 전부 HTTPS로 영구 리다이렉트.
    server {
        listen 80;
        server_name _;

        # Let's Encrypt HTTP-01 챌린지(certbot webroot). 리다이렉트보다 먼저 매칭돼야
        # 갱신이 무한 리다이렉트로 실패하지 않는다.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # SSL — cert 경로는 certbot 볼륨(/etc/nginx/ssl)에 마운트된다.
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Security headers
        # HSTS: 앱은 https만 쓰므로 서브도메인 포함 2년. preload는 도메인 확정 후 오너 판단.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Client body size limit
        client_max_body_size 12M;  # L15: 앱 사진 한도 10MB + multipart 오버헤드 여유

        # Public health checks (liveness/readiness) — M9: prefix가 아닌 정확 매칭 +
        # rate limit로 무스로틀 정찰/증폭 표면 축소.
        location = /health {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }
        location = /health/live {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }
        location = /health/ready {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }
        # M9: /health/detailed 는 내부 메트릭·config·missing_keys를 노출한다. 공개 엣지에서
        # 차단(내부망 전용). 앱도 X-Admin-Key를 요구하나 이중 방어로 프록시에서 막는다.
        location = /health/detailed {
            deny all;
            return 403;
        }

        # API endpoints
        location /v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # Public share pages (prefix 없이 등록된 /share/{token}). 이 블록이 없으면
        # 모든 공개 공유 링크가 nginx에서 404 — 앱 내 테스트는 ASGI 직접호출이라 못 잡는다.
        location /share/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;

            # 공유 토큰은 capability URL — 액세스 로그에 남기지 않는다(로그 유출 시 재생 방지).
            access_log off;

            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # API docs
        location /docs {
            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /openapi.json {
            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Custom error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
