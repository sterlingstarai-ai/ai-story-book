services:
  # ===================
  # Nginx Reverse Proxy
  # ===================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # H9: TLS 인증서(fullchain.pem/privkey.pem). certbot 이 여기에 발급/갱신한다.
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # H9: Let's Encrypt HTTP-01 챌린지 webroot(nginx 80 리스너가 서빙).
      - certbot-webroot:/var/www/certbot
      - nginx-cache:/var/cache/nginx
    depends_on:
      - api
    restart: always
    networks:
      app-network:
        ipv4_address: ${NGINX_PROXY_IP:-172.30.0.2}

  # ===================
  # Certbot (TLS 인증서 발급/자동 갱신) — H9
  # ===================
  # 최초 발급은 오너가 1회 실행한다(DEPLOYMENT.md "TLS 종단" 절):
  #   docker compose -f docker-compose.prod.yml run --rm --entrypoint certbot certbot certonly \
  #     --webroot -w /var/www/certbot -d api.example.com --email ops@example.com \
  #     --agree-tos --no-eff-email
  # 이후 이 컨테이너가 12시간마다 갱신을 시도한다. 호스트에서 nginx reload를 별도 예약한다.
  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do certbot renew --webroot -w /var/www/certbot --quiet;
             sleep 12h & wait $${!}; done"
    restart: always
    networks:
      - app-network

  # ===================
  # API Server
  # ===================
  api:
    image: ${API_IMAGE:-ghcr.io/sterlingstarai-ai/ai-story-book/api:latest}
    # L15: 의존성 인지형 readiness 프로브로 오버라이드(이미지 기본 HEALTHCHECK의 /health는
    # 무조건 200이라 DB/Redis가 죽어도 healthy — 병든 replica로 트래픽이 계속 감).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      # Only nginx may supply forwarded client addresses to the public limiter.
      - FORWARDED_ALLOW_IPS=${NGINX_PROXY_IP:-172.30.0.2}
      # Database
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - DATABASE_SSL_MODE=${DATABASE_SSL_MODE:-}
      - DATABASE_SSL_ROOT_CERT=${DATABASE_SSL_ROOT_CERT:-}
      - DATABASE_MIGRATION_URL=${DATABASE_MIGRATION_URL:-}
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # Celery
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - USE_CELERY=${USE_CELERY:-true}
      # LLM
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_KEY_FILE=${LLM_API_KEY_FILE:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-90}
      - PROVIDER_OBSERVATION_TTL_SECONDS=${PROVIDER_OBSERVATION_TTL_SECONDS:-86400}
      - GENERATION_ACCESS_MODE=${GENERATION_ACCESS_MODE:-invite_only}
      - FREE_PLAN_FIRST_BOOK_TRIAL=${FREE_PLAN_FIRST_BOOK_TRIAL:-false}
      - GENERATION_ALLOWED_USER_HASHES=${GENERATION_ALLOWED_USER_HASHES:-}
      - STORE_REVIEW_PASS_HASH=${STORE_REVIEW_PASS_HASH:-}
      - STORE_REVIEW_ACCOUNT_SLOTS=${STORE_REVIEW_ACCOUNT_SLOTS:-}
      - PROVIDER_USAGE_PRICES_JSON=${PROVIDER_USAGE_PRICES_JSON:-}
      # Image
      - IMAGE_PROVIDER=${IMAGE_PROVIDER}
      - IMAGE_API_KEY=${IMAGE_API_KEY}
      - IMAGE_API_KEY_FILE=${IMAGE_API_KEY_FILE:-}
      - IMAGE_MODEL=${IMAGE_MODEL:-gpt-image-2.6-flare}
      - OPENAI_ILLUSTRATION_REPAIR_MODEL=${OPENAI_ILLUSTRATION_REPAIR_MODEL:-}
      - OPENAI_IMAGE_QUALITY=${OPENAI_IMAGE_QUALITY:-medium}
      - IMAGE_TIMEOUT=${IMAGE_TIMEOUT:-90}
      - IMAGE_MAX_CONCURRENT=${IMAGE_MAX_CONCURRENT:-3}
      - IMAGE_MAX_RETRIES=${IMAGE_MAX_RETRIES:-3}
      - ILLUSTRATION_QUALITY_ENABLED=${ILLUSTRATION_QUALITY_ENABLED:-true}
      - PHOTO_PROCESSING_ENABLED=${PHOTO_PROCESSING_ENABLED:-false}
      - PHOTO_ANALYSIS_PROVIDER=${PHOTO_ANALYSIS_PROVIDER:-openai}
      - PHOTO_ANALYSIS_MODEL=${PHOTO_ANALYSIS_MODEL:-gpt-5.6-sol}
      - PHOTO_ANALYSIS_API_KEY=${PHOTO_ANALYSIS_API_KEY:-}
      # 오디오(TTS/STT) — G9/H1: mock 기본값 금지. 미설정이면 readiness(테스트 아님)에서
      # tts_provider_not_live/stt_provider_not_live로 잡혀 무음 오디오 배포를 차단한다.
      - AUDIO_FEATURE_ENABLED=${AUDIO_FEATURE_ENABLED:-false}
      - AUDIO_NARRATION_ONLY_ENABLED=${AUDIO_NARRATION_ONLY_ENABLED:-false}
      - TTS_PROVIDER=${TTS_PROVIDER}
      - OPENAI_TTS_API_KEY=${OPENAI_TTS_API_KEY:-}
      - OPENAI_TTS_API_KEY_FILE=${OPENAI_TTS_API_KEY_FILE:-}
      - OPENAI_TTS_MODEL=${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      - OPENAI_TTS_VOICE=${OPENAI_TTS_VOICE:-coral}
      - GOOGLE_TTS_API_KEY=${GOOGLE_TTS_API_KEY:-}
      - GOOGLE_GEMINI_TTS_PROJECT=${GOOGLE_GEMINI_TTS_PROJECT:-}
      - GOOGLE_GEMINI_TTS_DAILY_REQUEST_LIMIT=${GOOGLE_GEMINI_TTS_DAILY_REQUEST_LIMIT:-0}
      - GOOGLE_GEMINI_TTS_MONTHLY_REQUEST_LIMIT=${GOOGLE_GEMINI_TTS_MONTHLY_REQUEST_LIMIT:-0}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
      - STT_PROVIDER=${STT_PROVIDER}
      - STT_API_KEY=${STT_API_KEY:-}
      - STT_MODEL=${STT_MODEL:-whisper-1}
      - GOOGLE_STT_API_KEY=${GOOGLE_STT_API_KEY:-}
      # Storage
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ADDRESSING_STYLE=${S3_ADDRESSING_STYLE:-path}
      - S3_AUTO_CREATE_BUCKET=${S3_AUTO_CREATE_BUCKET:-true}
      - S3_DOWNLOAD_ENDPOINT=${S3_DOWNLOAD_ENDPOINT:-}
      - S3_DOWNLOAD_TTL_SECONDS=${S3_DOWNLOAD_TTL_SECONDS:-3600}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET:-ai-story-book}
      - PRIVACY_JOURNAL_ENABLED=${PRIVACY_JOURNAL_ENABLED:-false}
      - PRIVACY_JOURNAL_BUCKET=${PRIVACY_JOURNAL_BUCKET:-}
      - PRIVACY_JOURNAL_WITNESS_BUCKET=${PRIVACY_JOURNAL_WITNESS_BUCKET:-}
      - PRIVACY_JOURNAL_WITNESS_S3_ENDPOINT=${PRIVACY_JOURNAL_WITNESS_S3_ENDPOINT:-}
      - PRIVACY_JOURNAL_WITNESS_S3_BUCKET=${PRIVACY_JOURNAL_WITNESS_S3_BUCKET:-}
      - PRIVACY_JOURNAL_WITNESS_S3_REGION=${PRIVACY_JOURNAL_WITNESS_S3_REGION:-}
      - PRIVACY_JOURNAL_WITNESS_S3_ACCESS_KEY=${PRIVACY_JOURNAL_WITNESS_S3_ACCESS_KEY:-}
      - PRIVACY_JOURNAL_WITNESS_S3_SECRET_KEY=${PRIVACY_JOURNAL_WITNESS_S3_SECRET_KEY:-}
      - PRIVACY_JOURNAL_KEY_FILE=${PRIVACY_JOURNAL_KEY_FILE:-}
      - ACCOUNT_SCOPE_KEY_FILE=${ACCOUNT_SCOPE_KEY_FILE:-}
      - ACCOUNT_SCOPE_KEY_SHA256=${ACCOUNT_SCOPE_KEY_SHA256:-}
      - GUARDIAN_EMAIL_CONSENT_ENABLED=${GUARDIAN_EMAIL_CONSENT_ENABLED:-false}
      - GUARDIAN_EMAIL_SMTP_HOST=${GUARDIAN_EMAIL_SMTP_HOST:-}
      - GUARDIAN_EMAIL_SMTP_PORT=${GUARDIAN_EMAIL_SMTP_PORT:-465}
      - GUARDIAN_EMAIL_SMTP_SECURITY=${GUARDIAN_EMAIL_SMTP_SECURITY:-implicit_tls}
      - GUARDIAN_EMAIL_SMTP_USERNAME=${GUARDIAN_EMAIL_SMTP_USERNAME:-}
      - GUARDIAN_EMAIL_SMTP_PASSWORD_FILE=${GUARDIAN_EMAIL_SMTP_PASSWORD_FILE:-}
      - GUARDIAN_EMAIL_SENDER=${GUARDIAN_EMAIL_SENDER:-}
      - GUARDIAN_EMAIL_PUBLIC_ORIGIN=${GUARDIAN_EMAIL_PUBLIC_ORIGIN:-}
      - ACCOUNT_SCOPE_NAMESPACE=${ACCOUNT_SCOPE_NAMESPACE:-}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
      # 과거 공개 URL base(콤마 구분) — 도메인 변경 후에도 파기 키 역산이 가능하도록.
      - S3_LEGACY_PUBLIC_URLS=${S3_LEGACY_PUBLIC_URLS:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      # POD (실물 인쇄 주문 — Printful)
      - POD_MODE=${POD_MODE:-local}
      - POD_ORDERING_ENABLED=${POD_ORDERING_ENABLED:-false}
      - POD_PROVIDER=${POD_PROVIDER:-printful}
      - PRINTFUL_API_KEY=${PRINTFUL_API_KEY:-}
      - PRINTFUL_STORE_ID=${PRINTFUL_STORE_ID:-}
      - PRINTFUL_SYNC_VARIANT_ID=${PRINTFUL_SYNC_VARIANT_ID:-0}
      - PRINTFUL_BASE_URL=${PRINTFUL_BASE_URL:-https://api.printful.com}
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS}
      # App (관리 API 인증 · 공유 링크 베이스 URL) — api 전용
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - SHARE_BASE_URL=${SHARE_BASE_URL:-}
      # Rate Limiting
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-10}
      - RATE_LIMIT_READ_REQUESTS=${RATE_LIMIT_READ_REQUESTS:-120}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
      # 비용 가드레일 (S4 / 2026-08-17 감사 H4). ⚠ X-User-Key 는 클라 발급이라 per-user
      # 통제가 키 로테이션으로 우회된다 — 이 전역 상한이 청구서의 유일한 실질 한도다.
      # 오너 결정(2026-08-17): 미설정 시 **0(무한)이 아니라 보수적 기본값**으로 폴백해
      # 초기 제한 베타: 전체 사용자 합계 하루 20회. 금액 상한이 아닌 생성 횟수 제한이다.
      # 제공자별 사용량/지출 한도도 별도로 설정하고 실측 후 조정한다.
      - DAILY_GENERATION_BUDGET=${DAILY_GENERATION_BUDGET:-20}
      - GENERATION_BUDGET_STORE=${GENERATION_BUDGET_STORE:-redis}
      - DAILY_JOB_LIMIT_PER_USER=${DAILY_JOB_LIMIT_PER_USER:-20}
      - MAX_PENDING_JOBS=${MAX_PENDING_JOBS:-500}
      - MAX_PENDING_JOBS_PER_USER=${MAX_PENDING_JOBS_PER_USER:-10}
      # IAP (결제 영수증 검증) — 운영은 strict 필수(미설정 시 readiness 차단).
      - IAP_VERIFICATION_MODE=${IAP_VERIFICATION_MODE:-strict}
      - PURCHASES_ENABLED=${PURCHASES_ENABLED:-false}
      - APPLE_APP_ID=${APPLE_APP_ID:-0}
      - APPLE_NOTIFICATION_ENVIRONMENT=${APPLE_NOTIFICATION_ENVIRONMENT:-Production}
      - APPLE_ROOT_CA_PATHS=${APPLE_ROOT_CA_PATHS:-}
      - GOOGLE_RTDN_AUDIENCE=${GOOGLE_RTDN_AUDIENCE:-}
      - GOOGLE_RTDN_SERVICE_ACCOUNT_EMAIL=${GOOGLE_RTDN_SERVICE_ACCOUNT_EMAIL:-}
      - APPLE_IAP_SHARED_SECRET=${APPLE_IAP_SHARED_SECRET:-}
      # M5: 팀 단위 shared secret 하 cross-app 영수증 리플레이 차단(미설정 시 readiness 차단).
      - APPLE_BUNDLE_ID=${APPLE_BUNDLE_ID:-}
      - GOOGLE_PLAY_PACKAGE_NAME=${GOOGLE_PLAY_PACKAGE_NAME:-}
      - GOOGLE_PLAY_ACCESS_TOKEN=${GOOGLE_PLAY_ACCESS_TOKEN:-}
      - GOOGLE_PLAY_SERVICE_ACCOUNT_JSON=${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}
      - GOOGLE_PLAY_SERVICE_ACCOUNT_FILE=${GOOGLE_PLAY_SERVICE_ACCOUNT_FILE:-}
      - IAP_WEBHOOK_SECRET=${IAP_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - app-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ===================
  # Celery Worker
  # ===================
  worker:
    image: ${WORKER_IMAGE:-ghcr.io/sterlingstarai-ai/ai-story-book/worker:latest}
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - DATABASE_SSL_MODE=${DATABASE_SSL_MODE:-}
      - DATABASE_SSL_ROOT_CERT=${DATABASE_SSL_ROOT_CERT:-}
      - DATABASE_MIGRATION_URL=${DATABASE_MIGRATION_URL:-}
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # Celery
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # LLM
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_KEY_FILE=${LLM_API_KEY_FILE:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-90}
      - PROVIDER_OBSERVATION_TTL_SECONDS=${PROVIDER_OBSERVATION_TTL_SECONDS:-86400}
      - GENERATION_ACCESS_MODE=${GENERATION_ACCESS_MODE:-invite_only}
      - FREE_PLAN_FIRST_BOOK_TRIAL=${FREE_PLAN_FIRST_BOOK_TRIAL:-false}
      - GENERATION_ALLOWED_USER_HASHES=${GENERATION_ALLOWED_USER_HASHES:-}
      - PROVIDER_USAGE_PRICES_JSON=${PROVIDER_USAGE_PRICES_JSON:-}
      # Image
      - IMAGE_PROVIDER=${IMAGE_PROVIDER}
      - IMAGE_API_KEY=${IMAGE_API_KEY}
      - IMAGE_API_KEY_FILE=${IMAGE_API_KEY_FILE:-}
      - IMAGE_MODEL=${IMAGE_MODEL:-gpt-image-2.6-flare}
      - OPENAI_ILLUSTRATION_REPAIR_MODEL=${OPENAI_ILLUSTRATION_REPAIR_MODEL:-}
      - OPENAI_IMAGE_QUALITY=${OPENAI_IMAGE_QUALITY:-medium}
      - IMAGE_TIMEOUT=${IMAGE_TIMEOUT:-90}
      - IMAGE_MAX_CONCURRENT=${IMAGE_MAX_CONCURRENT:-3}
      - IMAGE_MAX_RETRIES=${IMAGE_MAX_RETRIES:-3}
      - ILLUSTRATION_QUALITY_ENABLED=${ILLUSTRATION_QUALITY_ENABLED:-true}
      - PHOTO_PROCESSING_ENABLED=${PHOTO_PROCESSING_ENABLED:-false}
      - PHOTO_ANALYSIS_PROVIDER=${PHOTO_ANALYSIS_PROVIDER:-openai}
      - PHOTO_ANALYSIS_MODEL=${PHOTO_ANALYSIS_MODEL:-gpt-5.6-sol}
      - PHOTO_ANALYSIS_API_KEY=${PHOTO_ANALYSIS_API_KEY:-}
      # 오디오(TTS/STT) — G9/H1: mock 기본값 금지. 미설정이면 readiness(테스트 아님)에서
      # tts_provider_not_live/stt_provider_not_live로 잡혀 무음 오디오 배포를 차단한다.
      - AUDIO_FEATURE_ENABLED=${AUDIO_FEATURE_ENABLED:-false}
      - AUDIO_NARRATION_ONLY_ENABLED=${AUDIO_NARRATION_ONLY_ENABLED:-false}
      - TTS_PROVIDER=${TTS_PROVIDER}
      - OPENAI_TTS_API_KEY=${OPENAI_TTS_API_KEY:-}
      - OPENAI_TTS_API_KEY_FILE=${OPENAI_TTS_API_KEY_FILE:-}
      - OPENAI_TTS_MODEL=${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      - OPENAI_TTS_VOICE=${OPENAI_TTS_VOICE:-coral}
      - GOOGLE_TTS_API_KEY=${GOOGLE_TTS_API_KEY:-}
      - GOOGLE_GEMINI_TTS_PROJECT=${GOOGLE_GEMINI_TTS_PROJECT:-}
      - GOOGLE_GEMINI_TTS_DAILY_REQUEST_LIMIT=${GOOGLE_GEMINI_TTS_DAILY_REQUEST_LIMIT:-0}
      - GOOGLE_GEMINI_TTS_MONTHLY_REQUEST_LIMIT=${GOOGLE_GEMINI_TTS_MONTHLY_REQUEST_LIMIT:-0}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
      - STT_PROVIDER=${STT_PROVIDER}
      - STT_API_KEY=${STT_API_KEY:-}
      - STT_MODEL=${STT_MODEL:-whisper-1}
      - GOOGLE_STT_API_KEY=${GOOGLE_STT_API_KEY:-}
      # Storage
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ADDRESSING_STYLE=${S3_ADDRESSING_STYLE:-path}
      - S3_AUTO_CREATE_BUCKET=${S3_AUTO_CREATE_BUCKET:-true}
      - S3_DOWNLOAD_ENDPOINT=${S3_DOWNLOAD_ENDPOINT:-}
      - S3_DOWNLOAD_TTL_SECONDS=${S3_DOWNLOAD_TTL_SECONDS:-3600}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET:-ai-story-book}
      - PRIVACY_JOURNAL_ENABLED=${PRIVACY_JOURNAL_ENABLED:-false}
      - PRIVACY_JOURNAL_BUCKET=${PRIVACY_JOURNAL_BUCKET:-}
      - PRIVACY_JOURNAL_WITNESS_BUCKET=${PRIVACY_JOURNAL_WITNESS_BUCKET:-}
      - PRIVACY_JOURNAL_WITNESS_S3_ENDPOINT=${PRIVACY_JOURNAL_WITNESS_S3_ENDPOINT:-}
      - PRIVACY_JOURNAL_WITNESS_S3_BUCKET=${PRIVACY_JOURNAL_WITNESS_S3_BUCKET:-}
      - PRIVACY_JOURNAL_WITNESS_S3_REGION=${PRIVACY_JOURNAL_WITNESS_S3_REGION:-}
      - PRIVACY_JOURNAL_WITNESS_S3_ACCESS_KEY=${PRIVACY_JOURNAL_WITNESS_S3_ACCESS_KEY:-}
      - PRIVACY_JOURNAL_WITNESS_S3_SECRET_KEY=${PRIVACY_JOURNAL_WITNESS_S3_SECRET_KEY:-}
      - PRIVACY_JOURNAL_KEY_FILE=${PRIVACY_JOURNAL_KEY_FILE:-}
      - ACCOUNT_SCOPE_KEY_FILE=${ACCOUNT_SCOPE_KEY_FILE:-}
      - ACCOUNT_SCOPE_KEY_SHA256=${ACCOUNT_SCOPE_KEY_SHA256:-}
      - GUARDIAN_EMAIL_CONSENT_ENABLED=${GUARDIAN_EMAIL_CONSENT_ENABLED:-false}
      - ACCOUNT_SCOPE_NAMESPACE=${ACCOUNT_SCOPE_NAMESPACE:-}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
      # 과거 공개 URL base(콤마 구분) — 도메인 변경 후에도 파기 키 역산이 가능하도록.
      - S3_LEGACY_PUBLIC_URLS=${S3_LEGACY_PUBLIC_URLS:-}
      # 비용 가드레일 — 워커도 같은 전역 카운터를 본다(API와 값 불일치 금지).
      # 기본값은 API 서비스와 동일하게 유지(초기 베타 하루 전체 20회).
      - DAILY_GENERATION_BUDGET=${DAILY_GENERATION_BUDGET:-20}
      - GENERATION_BUDGET_STORE=${GENERATION_BUDGET_STORE:-redis}
      - S3_REGION=${S3_REGION:-us-east-1}
      # POD (실물 인쇄 주문 — Printful)
      - POD_MODE=${POD_MODE:-local}
      - POD_ORDERING_ENABLED=${POD_ORDERING_ENABLED:-false}
      - POD_PROVIDER=${POD_PROVIDER:-printful}
      - PRINTFUL_API_KEY=${PRINTFUL_API_KEY:-}
      - PRINTFUL_STORE_ID=${PRINTFUL_STORE_ID:-}
      - PRINTFUL_SYNC_VARIANT_ID=${PRINTFUL_SYNC_VARIANT_ID:-0}
      - PRINTFUL_BASE_URL=${PRINTFUL_BASE_URL:-https://api.printful.com}
      # IAP (worker도 환불 회수/구독 동기화 경로에서 동일 설정 필요).
      - IAP_VERIFICATION_MODE=${IAP_VERIFICATION_MODE:-strict}
      - PURCHASES_ENABLED=${PURCHASES_ENABLED:-false}
      - APPLE_APP_ID=${APPLE_APP_ID:-0}
      - APPLE_NOTIFICATION_ENVIRONMENT=${APPLE_NOTIFICATION_ENVIRONMENT:-Production}
      - APPLE_ROOT_CA_PATHS=${APPLE_ROOT_CA_PATHS:-}
      - GOOGLE_RTDN_AUDIENCE=${GOOGLE_RTDN_AUDIENCE:-}
      - GOOGLE_RTDN_SERVICE_ACCOUNT_EMAIL=${GOOGLE_RTDN_SERVICE_ACCOUNT_EMAIL:-}
      - APPLE_IAP_SHARED_SECRET=${APPLE_IAP_SHARED_SECRET:-}
      - APPLE_BUNDLE_ID=${APPLE_BUNDLE_ID:-}
      - GOOGLE_PLAY_PACKAGE_NAME=${GOOGLE_PLAY_PACKAGE_NAME:-}
      - GOOGLE_PLAY_ACCESS_TOKEN=${GOOGLE_PLAY_ACCESS_TOKEN:-}
      - GOOGLE_PLAY_SERVICE_ACCOUNT_JSON=${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}
      - GOOGLE_PLAY_SERVICE_ACCOUNT_FILE=${GOOGLE_PLAY_SERVICE_ACCOUNT_FILE:-}
      - IAP_WEBHOOK_SECRET=${IAP_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - app-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ===================
  # PostgreSQL Database
  # ===================
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ===================
  # Redis
  # ===================
  redis:
    image: redis:7-alpine
    # Redis stores broker messages and cost limits: never evict them under memory pressure.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ===================
  # MinIO (Optional - for self-hosted S3)
  # ===================
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always
    networks:
      - app-network
    profiles:
      - storage

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${APP_NETWORK_SUBNET:-172.30.0.0/24}

volumes:
  certbot-webroot:
  postgres-data:
  redis-data:
  minio-data:
  nginx-cache:
