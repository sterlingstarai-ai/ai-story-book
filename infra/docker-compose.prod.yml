services:
  # ===================
  # Nginx Reverse Proxy
  # ===================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - api
    restart: always
    networks:
      - app-network

  # ===================
  # API Server
  # ===================
  api:
    image: ${API_IMAGE:-ghcr.io/sterlingstarai-ai/ai-story-book/api:latest}
    # L15: 의존성 인지형 readiness 프로브로 오버라이드(이미지 기본 HEALTHCHECK의 /health는
    # 무조건 200이라 DB/Redis가 죽어도 healthy — 병든 replica로 트래픽이 계속 감).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # Celery
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - USE_CELERY=${USE_CELERY:-true}
      # LLM
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-30}
      # Image
      - IMAGE_PROVIDER=${IMAGE_PROVIDER}
      - IMAGE_API_KEY=${IMAGE_API_KEY}
      - IMAGE_MODEL=${IMAGE_MODEL:-dall-e-3}
      - IMAGE_TIMEOUT=${IMAGE_TIMEOUT:-90}
      - IMAGE_MAX_CONCURRENT=${IMAGE_MAX_CONCURRENT:-3}
      - IMAGE_MAX_RETRIES=${IMAGE_MAX_RETRIES:-3}
      # 오디오(TTS/STT) — G9/H1: mock 기본값 금지. 미설정이면 readiness(테스트 아님)에서
      # tts_provider_not_live/stt_provider_not_live로 잡혀 무음 오디오 배포를 차단한다.
      - AUDIO_FEATURE_ENABLED=${AUDIO_FEATURE_ENABLED:-false}
      - TTS_PROVIDER=${TTS_PROVIDER}
      - GOOGLE_TTS_API_KEY=${GOOGLE_TTS_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
      - STT_PROVIDER=${STT_PROVIDER}
      - STT_API_KEY=${STT_API_KEY:-}
      - GOOGLE_STT_API_KEY=${GOOGLE_STT_API_KEY:-}
      # Storage
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET:-ai-story-book}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      # POD (실물 인쇄 주문 — Printful)
      - POD_MODE=${POD_MODE:-local}
      - POD_PROVIDER=${POD_PROVIDER:-printful}
      - PRINTFUL_API_KEY=${PRINTFUL_API_KEY:-}
      - PRINTFUL_STORE_ID=${PRINTFUL_STORE_ID:-}
      - PRINTFUL_SYNC_VARIANT_ID=${PRINTFUL_SYNC_VARIANT_ID:-}
      - PRINTFUL_BASE_URL=${PRINTFUL_BASE_URL:-https://api.printful.com}
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS}
      # App (관리 API 인증 · 공유 링크 베이스 URL) — api 전용
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - SHARE_BASE_URL=${SHARE_BASE_URL:-}
      # Rate Limiting
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-10}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
      # IAP (결제 영수증 검증) — 운영은 strict 필수(미설정 시 readiness 차단).
      - IAP_VERIFICATION_MODE=${IAP_VERIFICATION_MODE:-strict}
      - APPLE_IAP_SHARED_SECRET=${APPLE_IAP_SHARED_SECRET:-}
      - GOOGLE_PLAY_PACKAGE_NAME=${GOOGLE_PLAY_PACKAGE_NAME:-}
      - GOOGLE_PLAY_ACCESS_TOKEN=${GOOGLE_PLAY_ACCESS_TOKEN:-}
      - GOOGLE_PLAY_SERVICE_ACCOUNT_JSON=${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}
      - GOOGLE_PLAY_SERVICE_ACCOUNT_FILE=${GOOGLE_PLAY_SERVICE_ACCOUNT_FILE:-}
      - IAP_WEBHOOK_SECRET=${IAP_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - app-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ===================
  # Celery Worker
  # ===================
  worker:
    image: ${WORKER_IMAGE:-ghcr.io/sterlingstarai-ai/ai-story-book/worker:latest}
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # Celery
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # LLM
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-30}
      # Image
      - IMAGE_PROVIDER=${IMAGE_PROVIDER}
      - IMAGE_API_KEY=${IMAGE_API_KEY}
      - IMAGE_MODEL=${IMAGE_MODEL:-dall-e-3}
      - IMAGE_TIMEOUT=${IMAGE_TIMEOUT:-90}
      - IMAGE_MAX_CONCURRENT=${IMAGE_MAX_CONCURRENT:-3}
      - IMAGE_MAX_RETRIES=${IMAGE_MAX_RETRIES:-3}
      # 오디오(TTS/STT) — G9/H1: mock 기본값 금지. 미설정이면 readiness(테스트 아님)에서
      # tts_provider_not_live/stt_provider_not_live로 잡혀 무음 오디오 배포를 차단한다.
      - AUDIO_FEATURE_ENABLED=${AUDIO_FEATURE_ENABLED:-false}
      - TTS_PROVIDER=${TTS_PROVIDER}
      - GOOGLE_TTS_API_KEY=${GOOGLE_TTS_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
      - STT_PROVIDER=${STT_PROVIDER}
      - STT_API_KEY=${STT_API_KEY:-}
      - GOOGLE_STT_API_KEY=${GOOGLE_STT_API_KEY:-}
      # Storage
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET:-ai-story-book}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      # POD (실물 인쇄 주문 — Printful)
      - POD_MODE=${POD_MODE:-local}
      - POD_PROVIDER=${POD_PROVIDER:-printful}
      - PRINTFUL_API_KEY=${PRINTFUL_API_KEY:-}
      - PRINTFUL_STORE_ID=${PRINTFUL_STORE_ID:-}
      - PRINTFUL_SYNC_VARIANT_ID=${PRINTFUL_SYNC_VARIANT_ID:-}
      - PRINTFUL_BASE_URL=${PRINTFUL_BASE_URL:-https://api.printful.com}
      # IAP (worker도 환불 회수/구독 동기화 경로에서 동일 설정 필요).
      - IAP_VERIFICATION_MODE=${IAP_VERIFICATION_MODE:-strict}
      - APPLE_IAP_SHARED_SECRET=${APPLE_IAP_SHARED_SECRET:-}
      - GOOGLE_PLAY_PACKAGE_NAME=${GOOGLE_PLAY_PACKAGE_NAME:-}
      - GOOGLE_PLAY_ACCESS_TOKEN=${GOOGLE_PLAY_ACCESS_TOKEN:-}
      - GOOGLE_PLAY_SERVICE_ACCOUNT_JSON=${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}
      - GOOGLE_PLAY_SERVICE_ACCOUNT_FILE=${GOOGLE_PLAY_SERVICE_ACCOUNT_FILE:-}
      - IAP_WEBHOOK_SECRET=${IAP_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - app-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ===================
  # PostgreSQL Database
  # ===================
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ===================
  # Redis
  # ===================
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ===================
  # MinIO (Optional - for self-hosted S3)
  # ===================
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always
    networks:
      - app-network
    profiles:
      - storage

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  nginx-cache:
