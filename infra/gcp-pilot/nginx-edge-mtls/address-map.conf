# Include in http{}. Caddy replaces X-Forwarded-For with one normalized IP.
# A direct client or absent/invalid chain always falls back to the socket peer.
map $http_x_forwarded_for $asb_single_address {
    default $remote_addr;
    "~^[0-9]{1,3}(?:\.[0-9]{1,3}){3}$" $http_x_forwarded_for;
    "~^(?=[0-9A-Fa-f:.]*:)[0-9A-Fa-f:.]{2,45}$" $http_x_forwarded_for;
}
map $ssl_client_verify $asb_client_address {
    default $remote_addr;
    SUCCESS $asb_single_address;
}
